<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>County GDP by Industry — BEA Data</title>
<meta name="description" content="Search Gross Domestic Product by county and industry, 2001–2024. See what drives each county's economy — from manufacturing and agriculture to professional services and government.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>County GDP by Industry</h1>
    <p class="subtitle">Gross Domestic Product by county and industry, 2001–2024 · U.S. Bureau of Economic Analysis</p>
</header>

<nav class="tabs">
    <button class="tab active" data-tab="name">By Name</button>
    <button class="tab" data-tab="state">By State</button>
    <button class="tab" data-tab="nearby">Near Me</button>
</nav>

<main>
    <!-- Name Search -->
    <section id="name-search" class="search-panel active">
        <input type="text" id="search-input" placeholder="Enter a county name..." autocomplete="off">
        <div id="search-results" class="results-list"></div>
    </section>

    <!-- State Browse -->
    <section id="state-search" class="search-panel">
        <select id="state-select">
            <option value="">Select a state...</option>
        </select>
        <div id="state-results" class="results-list"></div>
    </section>

    <!-- Nearby Search -->
    <section id="nearby-search" class="search-panel">
        <div class="nearby-inputs">
            <input type="text" id="addr-input" placeholder="Enter an address or zip code...">
            <select id="radius-select">
                <option value="10">10 mi</option>
                <option value="25">25 mi</option>
                <option value="50" selected>50 mi</option>
                <option value="100">100 mi</option>
            </select>
            <button id="nearby-btn">Search</button>
        </div>
        <div id="nearby-results" class="results-list"></div>
    </section>

    <!-- Intro -->
    <div id="intro">
        <div id="intro-stats"></div>
    </div>

    <!-- County Detail -->
    <div id="detail" class="hidden">
        <button id="back-btn">← Back to results</button>
        <div id="detail-content"></div>
    </div>
</main>

<footer id="about">
    <p>Data: <a href="https://www.bea.gov/data/gdp/gdp-county-metro-and-other-areas">U.S. Bureau of Economic Analysis (BEA)</a>. GDP figures in thousands of chained 2017 dollars, 2001–2024.
    This is public economic data, not investment advice. <a href="https://github.com/GreatTombProductions/county-gdp">Source on GitHub</a>.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
